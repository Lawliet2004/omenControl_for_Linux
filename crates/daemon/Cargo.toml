[package]
name = "omen-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Privileged hardware control daemon"

[[bin]]
name = "omen-daemon"
path = "src/main.rs"

[dependencies]
omen-core = { path = "../core" }
omen-hardware = { path = "../hardware" }
omen-ipc = { path = "../ipc" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
