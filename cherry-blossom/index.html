<!doctype html>
<html lang="en" data-theme="day">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Sakura Drift — a cherry blossom animation</title>
  <meta name="description" content="A generative, interactive cherry blossom scene: swaying trees, falling petals, day and night, drifting mist and wind." />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="day">
  <canvas id="scene" role="img" aria-label="Animated cherry blossom grove: two trees swaying in the wind while pink petals drift, spiral and settle on the water below."></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="title">
    <p class="title__kicker">A living sketch</p>
    <h1 class="title__heading">Sakura <em>Drift</em></h1>
    <p class="title__sub">Petals fall, the wind turns, and the night brings fireflies to the grove.</p>
  </header>

  <div class="counter" aria-live="off">
    <strong id="petal-count">0</strong>
    petals in the air
  </div>

  <div class="dock" role="toolbar" aria-label="Scene controls">
    <button class="btn" id="btn-wind" type="button" aria-pressed="false" aria-keyshortcuts="G">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 8h11a3 3 0 1 0-3-3" />
        <path d="M3 16h15a3 3 0 1 1-3 3" />
        <path d="M3 12h7" />
      </svg>
      <span class="btn__label--long">Gust</span><span class="btn__label--short">Gust</span>
    </button>

    <button class="btn" id="btn-theme" type="button" aria-pressed="false" aria-keyshortcuts="N">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" />
      </svg>
      <span class="btn__label--long">Night</span><span class="btn__label--short">Night</span>
    </button>

    <div class="divider" aria-hidden="true"></div>

    <div class="wind" role="radiogroup" aria-label="Wind strength">
      <span class="wind__label" aria-hidden="true">Wind</span>
      <button class="wind__seg" type="button" role="radio" aria-checked="false" data-wind="calm">Calm</button>
      <button class="wind__seg" type="button" role="radio" aria-checked="true" data-wind="breeze">Breeze</button>
      <button class="wind__seg" type="button" role="radio" aria-checked="false" data-wind="storm">Storm</button>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <button class="btn" id="btn-motion" type="button" aria-pressed="false" aria-keyshortcuts="M">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 5v14l11-7z" />
      </svg>
      <span id="motion-label">Pause</span>
    </button>
  </div>

  <p class="hint">Click the scene for a gust · N night · M pause</p>

  <script src="main.js" defer></script>
</body>
</html>
