<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- omen-linux application icon: dark hex shield with fan motif -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262e"/>
      <stop offset="1" stop-color="#14161b"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#bg)" stroke="#2e323c" stroke-width="2"/>
  <!-- stylized fan -->
  <g transform="translate(64,64)">
    <circle r="40" fill="none" stroke="#3a3f4b" stroke-width="3"/>
    <g fill="#e5484d">
      <path d="M0,0 C6,-10 4,-28 -6,-32 C-16,-36 -22,-22 -14,-12 C-8,-4 -4,-2 0,0 Z"/>
      <path d="M0,0 C10,6 28,4 32,-6 C36,-16 22,-22 12,-14 C4,-8 2,-4 0,0 Z" transform="rotate(90)"/>
      <path d="M0,0 C10,6 28,4 32,-6 C36,-16 22,-22 12,-14 C4,-8 2,-4 0,0 Z" transform="rotate(180)"/>
      <path d="M0,0 C10,6 28,4 32,-6 C36,-16 22,-22 12,-14 C4,-8 2,-4 0,0 Z" transform="rotate(270)"/>
    </g>
    <circle r="7" fill="#e8eaee" stroke="#b8bcc4" stroke-width="2"/>
  </g>
</svg>
